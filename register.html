<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransportAdmin - Inscription</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <!-- Section gauche avec image -->
        <div class="auth-left">
            <div class="auth-image-placeholder">
                <div>
                    <i class="fas fa-users fa-4x mb-4"></i>
                    <h2>Rejoignez-nous</h2>
                    <p>Gérez efficacement votre société de transport</p>
                </div>
            </div>
        </div>

        <!-- Section droite avec formulaire -->
        <div class="auth-right">
            <div class="auth-form">
                <div class="auth-header">
                    <h1 class="auth-title">
                        <i class="fas fa-route" style="color: var(--primary-orange);"></i>
                        TransportAdmin
                    </h1>
                    <h2 class="auth-title">Inscription</h2>
                    <p class="auth-subtitle">Créez votre compte administrateur</p>
                </div>

                <form id="registerForm">
                    <div class="grid grid-2">
                        

                        <div class="form-group">
                            <i class="fas fa-user form-icon"></i>
                            <input type="text" name="nom" id="register-nom" class="form-input" placeholder=" " required>
                            <label class="form-label" for="register-nom">Nom</label>
                        </div>
                        <div class="form-group">
                            <i class="fas fa-user form-icon"></i>
                            <input type="text" name="prenom" id="register-prenom" class="form-input" placeholder=" " required>
                            <label class="form-label" for="register-prenom">Prénom</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-building form-icon"></i>
                        <input type="text" name="compagnie" id="register-compagnie" class="form-input" placeholder=" " required>
                        <label class="form-label" for="register-compagnie">Société de transport</label>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-envelope form-icon"></i>
                        <input type="email" name="email" id="register-email" class="form-input" placeholder=" " required>
                        <label class="form-label" for="register-email">Adresse email professionnelle</label>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-phone form-icon"></i>
                        <input type="tel" name="telephone" id="register-telephone" class="form-input" placeholder=" " required>
                        <label class="form-label" for="register-telephone">Téléphone</label>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-lock form-icon"></i>
                        <input type="password" name="password" id="register-password" class="form-input" placeholder=" " required minlength="6">
                        <label class="form-label" for="register-password">Mot de passe (min. 6 caractères)</label>
                    </div>

                    <div class="form-group">
                        <i class="fas fa-lock form-icon"></i>
                        <input type="password" name="confirmPassword" id="register-confirmPassword" class="form-input" placeholder=" " required>
                        <label class="form-label" for="register-confirmPassword">Confirmer le mot de passe</label>
                    </div>

                    <div class="mb-4">
                        <label class="flex items-center">
                            <input type="checkbox" name="terms" required style="margin-right: 8px;">
                            <span style="font-size: 14px; color: var(--dark-gray);">
                                J'accepte les 
                                <a href="#" class="auth-link">conditions d'utilisation</a> 
                                et la 
                                <a href="#" class="auth-link">politique de confidentialité</a>
                            </span>
                        </label>
                    </div>


                    <button type="submit" class="btn btn-primary btn-lg w-full mb-4">
                        <i class="fas fa-user-plus"></i>
                        Créer mon compte
                    </button>

                    <div class="text-center">
                        <p style="color: var(--dark-gray);">
                            Déjà un compte ? 
                            <a href="index.html" class="auth-link">Se connecter</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
        // Validation du formulaire d'inscription
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const password = document.querySelector('input[name="password"]').value;
            const confirmPassword = document.querySelector('input[name="confirmPassword"]').value;
            
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Les mots de passe ne correspondent pas');
                return false;
            }
        });
    </script>
</body>
</html>
